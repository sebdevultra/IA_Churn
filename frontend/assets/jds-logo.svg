<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <style>
      .navy-fill { fill: #172440; }
      .light-stroke { stroke: #D0DCE5; stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; }
      .white-text { fill: #E8EEF3; font-family: 'DM Sans', 'Arial Black', sans-serif; font-weight: 900; }
      .navy-text { fill: #172440; font-family: 'DM Sans', 'Arial Black', sans-serif; font-weight: 800; }
      .banner-bg { fill: #D0DCE5; rx: 12px; }
    </style>
  </defs>

  <!-- Base Leaf Outer Border -->
  <path class="navy-fill light-stroke" d="
    M 250 15 
    L 282 105 L 345 65 L 332 170 L 415 150 L 380 225 L 485 240 L 430 330 L 475 350 L 375 425 L 350 425 L 350 480 L 250 515 L 150 480 L 150 425 L 125 425 L 25 350 L 70 330 L 15 240 L 120 225 L 85 150 L 168 170 L 155 65 L 218 105 Z" 
  />

  <!-- Inner Leaf Central Rib Line -->
  <line x1="250" y1="35" x2="250" y2="210" stroke="#D0DCE5" stroke-width="4" stroke-linecap="round" />

  <!-- Central JDS Text -->
  <text x="250" y="340" text-anchor="middle" font-size="135" class="white-text" letter-spacing="-3">JDS</text>

  <!-- Banner Box -->
  <rect x="65" y="365" width="370" height="52" rx="10" class="banner-bg" />

  <!-- Banner Text -->
  <text x="250" y="401" text-anchor="middle" font-size="30" class="navy-text" letter-spacing="2">ENERGY &amp; MINING</text>
</svg>
